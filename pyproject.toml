[project]
name = "water-aware-coffee"
version = "0.0.1"
description = "Water-aware coffee brewing: a tap-water chemistry atlas, a roast-matching model, and dial-in rules."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Fellipe Giuliano Duarte" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "pandera>=0.20",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
analysis = [
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.scripts]
wac = "water_aware_coffee.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/water_aware_coffee"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "N806"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "pandera.pandas.dataframe_check",
    "pandera.pandas.check",
    "pandera.dataframe_check",
    "pandera.check",
    "dataframe_check",
    "check",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pandera.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
